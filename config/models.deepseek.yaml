# Every tier on DEEPSEEK_API_KEY alone — for easy development; consensus within one provider is moot.
models:
  # corpus-describer, file-hyde, generic-hyde, hyde-generator, region-finder, topic-assigner
  lite:
    model: deepseek/deepseek-v4-flash
    reasoning_effort: low

  # region-marker — same model as lite, DeepSeek publishes two.
  mid:
    model: deepseek/deepseek-v4-flash
    reasoning_effort: low

  # qual-coder
  strong:
    model: deepseek/deepseek-v4-pro
    reasoning_effort: medium

  # scout-filter and semantic-filter run their tier's model at its thinking floor.
  mid-instant:
    extends: mid
    reasoning_effort: none
  strong-instant:
    extends: strong
    reasoning_effort: none

  # An alias prompt resolves against shared/ and goes in front of the agent's own.
  strong-planning:
    extends: strong
    prompt: nabu/modes/planning.md
  strong-execution:
    extends: strong
    prompt: nabu/modes/execution.md

  # deep-analysis-adjudicate and refine-code — same model as strong.
  expert:
    model: deepseek/deepseek-v4-pro
    reasoning_effort: low
    # Unverified whether DeepSeek accepts the frontend's explicit cache breakpoints.
    prompt_cache_breakpoints: false

  # deep-analysis-filter voters.
  voter-one:
    extends: expert
  voter-two:
    extends: expert
