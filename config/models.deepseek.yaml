# Every tier on DEEPSEEK_API_KEY alone — for easy development; consensus within one provider is moot.
models:
  # corpus-describer, file-hyde, generic-hyde, hyde-generator, topic-assigner
  lite:
    model: deepseek/deepseek-v4-flash
    reasoning_effort: low

  # scout-filter — same model as lite, DeepSeek publishes two.
  mid:
    model: deepseek/deepseek-v4-flash
    reasoning_effort: low

  # qual-coder, semantic-filter, refine-code
  strong:
    model: deepseek/deepseek-v4-pro
    reasoning_effort: medium

  # An alias prompt resolves against shared/ and goes in front of the agent's own.
  strong-planning:
    extends: strong
    prompt: nabu/modes/planning.md
  strong-execution:
    extends: strong
    prompt: nabu/modes/execution.md

  # deep-analysis-adjudicate and both filter voters — same model as strong.
  expert:
    model: deepseek/deepseek-v4-pro
    reasoning_effort: low
    # Unverified whether DeepSeek accepts the frontend's explicit cache breakpoints.
    prompt_cache_breakpoints: false
