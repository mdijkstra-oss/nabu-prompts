# Every tier on GEMINI_API_KEY alone — for easy development; consensus within one provider is moot.
models:
  # corpus-describer, file-hyde, generic-hyde, hyde-generator, topic-assigner
  lite:
    model: gemini/gemini-3.5-flash-lite
    reasoning_effort: minimal

  # region-marker
  mid:
    model: gemini/gemini-3.6-flash
    reasoning_effort: minimal

  # qual-coder — same model as mid, Gemini's Pro line is preview-only.
  strong:
    model: gemini/gemini-3.6-flash
    reasoning_effort: medium

  # scout-filter and semantic-filter run their tier's model at its thinking floor.
  mid-instant:
    extends: mid
    reasoning_effort: minimal
  strong-instant:
    extends: strong
    reasoning_effort: minimal

  # region-finder — occurrence finding follows exclusion rules; it needs a
  # competent model at low effort.
  finder:
    model: gemini/gemini-3.6-flash
    reasoning_effort: low

  # An alias prompt resolves against shared/ and goes in front of the agent's own.
  strong-planning:
    extends: strong
    prompt: nabu/modes/planning.md
  strong-execution:
    extends: strong
    prompt: nabu/modes/execution.md

  # deep-analysis-adjudicate and refine-code — same model as strong.
  expert:
    model: gemini/gemini-3.6-flash
    reasoning_effort: low
    # Unverified whether Gemini accepts the frontend's explicit cache breakpoints.
    prompt_cache_breakpoints: false

  # deep-analysis-filter voters.
  voter-one:
    extends: expert
  voter-two:
    extends: expert
