# Agents name tiers, never models. Swap this file for a models.<provider>.yaml to run on one key.
models:
  # corpus-describer, file-hyde, generic-hyde, hyde-generator, region-finder, topic-assigner
  lite:
    model: gemini/gemini-3.5-flash-lite
    reasoning_effort: minimal

  # region-marker, scout-filter
  mid:
    model: deepseek/deepseek-v4-flash
    reasoning_effort: none

  # qual-coder, semantic-filter
  strong:
    model: gemini/gemini-3.6-flash
    reasoning_effort: low

  # An alias prompt resolves against shared/ and goes in front of the agent's own.
  strong-planning:
    extends: strong
    prompt: nabu/modes/planning.md
  strong-execution:
    extends: strong
    prompt: nabu/modes/execution.md

  # deep-analysis-adjudicate and refine-code
  expert:
    model: anthropic/claude-opus-5
    reasoning_effort: medium

  # deep-analysis-filter — one alias per voter, so consensus crosses providers.
  voter-one:
    model: anthropic/claude-sonnet-5
    reasoning_effort: low
  voter-two:
    model: openai/gpt-5.6-terra
    reasoning_effort: low
    verbosity: low
    reasoning_summary: concise
