# Every tier on the signed-in Codex bridge — for local evaluation without an API key.
models:
  lite:
    model: codex/gpt-5.6-luna
    reasoning_effort: none

  mid:
    model: codex/gpt-5.6-terra
    reasoning_effort: none
    verbosity: low
    reasoning_summary: concise

  strong:
    model: codex/gpt-5.6-sol
    reasoning_effort: medium
    verbosity: low
    reasoning_summary: concise

  mid-instant:
    extends: mid
    reasoning_effort: none
  strong-instant:
    extends: strong
    reasoning_effort: none

  finder:
    model: codex/gpt-5.6-terra
    reasoning_effort: low

  strong-planning:
    extends: strong
    prompt: nabu/modes/planning.md
  strong-execution:
    extends: strong
    prompt: nabu/modes/execution.md

  expert:
    model: codex/gpt-5.6-sol
    reasoning_effort: low
    verbosity: low
    reasoning_summary: concise

  voter-one:
    model: codex/gpt-5.6-terra
    reasoning_effort: medium
    verbosity: low
    reasoning_summary: concise
  voter-two:
    model: codex/gpt-5.6-terra
    reasoning_effort: low
    verbosity: low
    reasoning_summary: concise
