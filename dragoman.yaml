# `auth` names the environment variable holding a key, never a key.

# Without this the services below join dragoman's embedded table rather than
# standing for all of it, and a models.yaml alias could name a prefix this file
# never listed.
mode: override

openai:
  endpoint: https://api.openai.com/v1
  protocol: openai-responses
  auth: OPENAI_API_KEY

anthropic:
  endpoint: https://api.anthropic.com/v1
  protocol: anthropic-messages
  auth: ANTHROPIC_API_KEY

gemini:
  endpoint: https://generativelanguage.googleapis.com/v1beta
  protocol: gemini-interactions
  auth: GEMINI_API_KEY

# DeepSeek has a JSON mode and no schema mode, and that mode asks for the shape
# in the prompt. It also spells the output cap the older way, which the protocol
# cannot know because OpenRouter speaks the same one and disagrees.
deepseek:
  endpoint: https://api.deepseek.com
  protocol: openai-completions
  auth: DEEPSEEK_API_KEY
  max_output_tokens_as: max_tokens
  schema_as_prompt: true

# The claude-bridge from the dragoman repo, running on the host, answering
# through a signed-in Claude Code instead of a key. One turn, no tools; the
# bridge refuses anything else. Reached only by a models file that names it.
claude-cli:
  endpoint: http://host.docker.internal:8082/v1
  protocol: anthropic-messages
  auth: CLAUDE_BRIDGE_KEY
